name: Supabase keep-alive

# Pings a DB-backed endpoint daily so the free-tier Supabase project does not
# get auto-paused for >7 days of inactivity.
on:
  schedule:
    # Daily at 07:17 UTC. Off-the-hour times are scheduled more reliably by
    # GitHub than :00.
    - cron: "17 7 * * *"
  workflow_dispatch: {} # allows manual runs from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping keep-alive endpoint
        run: |
          echo "Pinging keep-alive endpoint..."
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            https://personalized-card-steel.vercel.app/api/keepalive)
          echo "HTTP $code"
          cat /tmp/body.txt
          echo
          test "$code" = "200"
